{% load finance ui %}
<a class="account-card" href="{{ account.get_absolute_url }}">
  <div class="card-top"><span class="account-symbol">{% icon 'account' %}</span><span class="account-owner">{{ account.user_name }}</span></div>
  <h3>{{ account.name }}</h3>
  <p class="account-balance">{{ account.balance|rubles }} <span class="currency">₽</span></p>
  <div class="account-bottom"><span>Текущий остаток</span>{% icon 'arrow' %}</div>
</a>

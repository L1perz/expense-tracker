{% load ui %}
<nav aria-label="Основная навигация" class="main-nav">
  {% with current=request.resolver_match.view_name %}
  <a href="{% url 'homepage:index' %}" {% if current == 'homepage:index' %}aria-current="page"{% endif %}>{% icon 'overview' %}<span>Обзор</span></a>
  <a href="{% url 'accounts:list' %}" {% if request.resolver_match.namespace == 'accounts' %}aria-current="page"{% endif %}>{% icon 'account' %}<span>Счета</span></a>
  <a href="{% url 'operations:list' %}" {% if request.resolver_match.namespace == 'operations' and current != 'operations:statistics' %}aria-current="page"{% endif %}>{% icon 'operations' %}<span>Операции</span></a>
  <a href="{% url 'operations:statistics' %}" {% if current == 'operations:statistics' %}aria-current="page"{% endif %}>{% icon 'statistics' %}<span>Статистика</span></a>
  <div class="nav-divider" aria-hidden="true"></div>
  <a href="{% url 'users:list' %}" {% if current == 'users:list' or current == 'users:create' or current == 'users:edit' %}aria-current="page"{% endif %}>{% icon 'users' %}<span>Пользователи</span></a>
  <a href="{% url 'categories:list' %}" {% if current == 'categories:list' or current == 'categories:create' or current == 'categories:edit' %}aria-current="page"{% endif %}>{% icon 'category' %}<span>Категории</span></a>
  {% endwith %}
</nav>
